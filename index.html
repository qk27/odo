<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
    }
    .card {
      background: rgba(0,0,0,0.25);
      padding: 2.5rem;
      border-radius: 16px;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 0.8rem;
    }
    h2 {
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.1rem;
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    .bear {
      width: 250px;
      max-width: 100%;
      margin: 1rem auto 1.5rem;
      display: block;
    }
    button {
      font-size: 1rem;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      margin: 0.5rem;
    }
    .yes {
      background: #fff;
      color: #ff4d6d;
      font-weight: bold;
    }
    .no {
      background: transparent;
      color: #fff;
      border: 1px solid #fff;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello my odo 💕</h1>

    <!-- First animated bear GIF -->
    <img src="images/bear.gif" alt="Cute bear asking to be your Valentine" class="bear" />

    <p>
      Life is better with you in it.<br/>
      Laughs hit harder, days feel warmer,
      and I don’t want to imagine Valentine’s Day without you.
    </p>

    <h2>Will you be my Valentine?</h2>

    <div>
      <button class="yes" onclick="yes()">Yes 💖</button>
      <button class="no" onclick="no()">I need time 😌</button>
    </div>
  </div>

  <script>
    function yes() {
      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          flex-direction:column;
          align-items:center;
          justify-content:center;
          text-align:center;
          background:linear-gradient(135deg, #ff758c, #ff7eb3);
          color:white;
          font-family:system-ui;
        ">
          <h1>Best decision ever 💘</h1>
          <p>Looking forward to spending Valentine with you odo.</p>

          <!-- Second GIF appears after clicking Yes -->
          <img src="images/heart-bear.gif" alt="Celebration bear" style="width:280px; max-width:90%; margin-top:1.5rem;" />
        </div>
      `;
    }

    function no() {
      alert("No you don't. Let's try that again wai 😌");
    }
  </script>
</body>
</html>
